[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "si-exchange-demo"
version = "0.1.0"
description = "Arabic RTL test-only simulated exchange"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "psycopg[binary]>=3.2,<4", "redis>=5.0,<7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "api*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
