services:
  si-exchange:
    build:
      context: .
      dockerfile: Dockerfile
    image: si-exchange-linux:local
    container_name: si-exchange-demo
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
