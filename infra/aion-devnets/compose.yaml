# LOCAL DEVELOPMENT ONLY.
# Anvil uses publicly known, pre-funded test accounts. Keep RPC ports bound to loopback.
# Never expose these endpoints publicly or reuse their keys for any real assets.
services:
  aion-nova:
    image: ghcr.io/foundry-rs/foundry:latest
    command: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--chain-id", "71101", "--block-time", "2"]
    ports:
      - "127.0.0.1:8545:8545"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  aion-orbit:
    image: ghcr.io/foundry-rs/foundry:latest
    command: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--chain-id", "71102", "--block-time", "2"]
    ports:
      - "127.0.0.1:8546:8545"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
