name: Binance Spot Testnet Connectivity

on:
  workflow_dispatch:
    inputs:
      run_order_lifecycle:
        description: "Opt in to submit, query, and cancel one small BTC/USDT limit order using testnet funds"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify-testnet-account-access:
    name: Verify testnet credentials and read-only account access
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      EXECUTION_MODE: binance_testnet
      REAL_TRADING_ENABLED: "false"
      BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
      BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
      ALLOW_TESTNET_ORDER: ${{ inputs.run_order_lifecycle }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Run local tests
        run: |
          python -m pytest -q tests/test_testnet_connection.py tests/test_binance_testnet.py
      - name: Verify signed read-only testnet account access
        run: python scripts/check_binance_testnet.py
      - name: Optional testnet order lifecycle
        if: inputs.run_order_lifecycle
        run: python scripts/testnet_order_lifecycle.py
