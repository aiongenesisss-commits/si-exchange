name: Redis Live Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**", "feat/**"]

permissions:
  contents: read

jobs:
  redis-integration:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      TEST_REDIS_URL: redis://localhost:6379/15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_redis_store.py
