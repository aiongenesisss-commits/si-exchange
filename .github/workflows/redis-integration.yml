name: SI Exchange Redis Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: si-redis-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  redis-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Test real Redis connectivity and reconnect persistence
        run: pytest -q tests/test_redis_integration.py
