name: Public Service Health Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: public-service-health-monitor
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check SI Exchange public endpoints
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          check() {
            local label="$1" path="$2"
            local code
            code="$(curl --silent --show-error --location --max-time 20 --output /tmp/health-body --write-out '%{http_code}' "https://si-exchange-1vq1.vercel.app${path}" || true)"
            if [[ "$code" == "200" ]]; then
              echo "PASS | $label | HTTP $code"
              echo "- ✅ **$label** — HTTP $code" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "FAIL | $label | expected HTTP 200, got ${code:-no response}"
              echo "- ❌ **$label** — expected HTTP 200, got ${code:-no response}" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          }
          check "SI Exchange health" "/health"
          check "SI Exchange readiness" "/ready"
          check "SI Exchange API safety flags" "/api"
          check "SI Exchange online manifest" "/online-manifest"
          check "SI Exchange public markets" "/markets"
          check "SI Exchange public network registry" "/networks"
          check "SI Exchange production-readiness report" "/production-readiness"
          exit "$failed"
