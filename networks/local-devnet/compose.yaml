# LOCAL DEVELOPMENT ONLY. These chains are ephemeral and are not public networks.
services:
  aion-nova:
    image: ghcr.io/foundry-rs/foundry:latest
    command: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--chain-id", "71101", "--block-time", "2", "--accounts", "10", "--balance", "10000"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast chain-id --rpc-url http://127.0.0.1:8545 | grep -qx 71101"]
      interval: 5s
      timeout: 3s
      retries: 20

  aion-orbit:
    image: ghcr.io/foundry-rs/foundry:latest
    command: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--chain-id", "71102", "--block-time", "2", "--accounts", "10", "--balance", "10000"]
    ports:
      - "8546:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast chain-id --rpc-url http://127.0.0.1:8545 | grep -qx 71102"]
      interval: 5s
      timeout: 3s
      retries: 20
